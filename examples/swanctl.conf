# Peers authenticate with their own pre-shared key, looked up in RADIUS by
# their IKE identity, and get the virtual IP RADIUS returns.
connections {
    sites {
        version = 2
        proposals = aes256gcm16-prfsha256-x25519,aes256gcm16-prfsha384-ecp384
        pools = psk-radius
        # Peers behind NAT; also lets ESP pass load balancers that only do UDP.
        encap = yes
        fragmentation = yes
        dpd_delay = 30s
        # One IKE_SA per identity: a reconnecting peer replaces its old one.
        unique = replace

        local {
            auth = psk
            id = vpn.example.com
        }
        remote {
            auth = psk
        }
        children {
            sites {
                # What peers reach through the tunnel.
                local_ts = 192.0.2.1/32
                esp_proposals = aes256gcm16,aes256gcm16-ecp384
                dpd_action = clear
            }
        }
    }
}
