# /etc/strongswan/strongswan.d/charon/psk-radius.conf (EL/Fedora)
# /etc/strongswan.d/charon/psk-radius.conf (Debian/Ubuntu)
psk-radius {
    load = yes

    # RADIUS server on the gateway itself.
    server = 127.0.0.1
    secret = change-me-to-a-long-random-secret

    # Clients send their identity as a plain string, e.g. "site-1.example.com".
    station_id_with_port = no
}
