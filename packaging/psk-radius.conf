psk-radius {

    # Whether to load the plugin. Configure a RADIUS server first.
    load = no

    # Address of the RADIUS server.
    # server =

    # Shared secret with the RADIUS server.
    # secret =

    # Authentication port of the RADIUS server.
    # port = 1812

    # Source address to send RADIUS requests from.
    # source =

    # NAS-Identifier to send in requests.
    # nas_identifier = strongSwan

    # Number of sockets (parallel requests) per server.
    # sockets = 1

    # Number of times a request is retransmitted. Lookups block the charon
    # thread handling the IKE_SA, so keep timeouts short.
    # retransmit_tries = 3

    # Retransmission timeout, in seconds.
    # retransmit_timeout = 1.0

    # Base of the exponential backoff between retransmissions.
    # retransmit_base = 1.4

    # Only look up identities matching these comma-separated identity
    # patterns, e.g. "*@example.com, *.sites.example.com". All by default.
    # identities =

    # Send printable ID_KEY_ID identities as plain strings in User-Name.
    # key_id_as_string = yes

    # Include the port in Calling-Station-Id and Called-Station-Id.
    # station_id_with_port = yes

    # Seconds to cache keys and virtual IPs RADIUS returned.
    # cache_ttl = 60

    # Seconds to cache rejections.
    # negative_cache_ttl = 10

    # Several RADIUS servers, as with eap-radius. Each section takes the options
    # above (address instead of server, auth_port or port) and a preference;
    # missing options fall back to the global ones.
    servers {
        # primary {
        #     address = 192.0.2.10
        #     secret =
        #     preference = 1
        # }
    }
}
